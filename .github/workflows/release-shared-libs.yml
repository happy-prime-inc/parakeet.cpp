name: release shared libraries

# A deliberately small release path for downstream FFI consumers. The regular
# release workflow builds CLI/server bundles plus CPU, Metal, Vulkan, CUDA and
# AppImage variants. This workflow builds only the four CPU/Metal shared
# libraries Classroom Captions ships, so refreshing its pinned native runtime
# does not accidentally spend the full release matrix.
#
# Publishing creates a draft release and tag through GITHUB_TOKEN. GitHub does
# not recursively start tag workflows for refs created by that token, so the
# full release remains an explicit later action: dispatch release.yml with this
# tag selected as the ref.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      release_tag:
        description: Release tag and artifact version
        required: true
        default: v0.5.0-hp1
        type: string
      publish:
        description: Create/update a draft release and upload the assets
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Configure shared C API library
        run: |
          version="${{ inputs.release_tag }}"
          cmake -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPARAKEET_SHARED=ON \
            -DPARAKEET_BUILD_CLI=OFF \
            -DPARAKEET_BUILD_SERVER=OFF \
            -DPARAKEET_BUILD_TESTS=OFF \
            -DPARAKEET_VERSION="${version#v}"

      - name: Build
        run: cmake --build build-shared -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Verify ABI and streaming exports
        run: |
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL("./build-shared/libparakeet.so")
          lib.parakeet_capi_abi_version.restype = ctypes.c_int
          assert lib.parakeet_capi_abi_version() == 7
          for name in (
              "parakeet_capi_stream_begin",
              "parakeet_capi_stream_feed_json",
              "parakeet_capi_stream_finalize_json",
              "parakeet_capi_stream_reset",
              "parakeet_capi_stream_free",
          ):
              getattr(lib, name)
          PY

      - name: Package
        id: package
        run: |
          bundle="parakeet-${{ inputs.release_tag }}-lib-linux-cpu-${{ matrix.arch }}"
          mkdir "$bundle"
          cp build-shared/libparakeet.so include/parakeet_capi.h LICENSE README.md "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.bundle }}
          path: ${{ steps.package.outputs.bundle }}.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Configure shared C API library
        run: |
          version="${{ inputs.release_tag }}"
          cmake -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPARAKEET_SHARED=ON \
            -DPARAKEET_BUILD_CLI=OFF \
            -DPARAKEET_BUILD_SERVER=OFF \
            -DPARAKEET_BUILD_TESTS=OFF \
            -DPARAKEET_GGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DPARAKEET_VERSION="${version#v}"

      - name: Build
        run: cmake --build build-shared -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Verify ABI and streaming exports
        run: |
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL("./build-shared/libparakeet.dylib")
          lib.parakeet_capi_abi_version.restype = ctypes.c_int
          assert lib.parakeet_capi_abi_version() == 7
          for name in (
              "parakeet_capi_stream_begin",
              "parakeet_capi_stream_feed_json",
              "parakeet_capi_stream_finalize_json",
              "parakeet_capi_stream_reset",
              "parakeet_capi_stream_free",
          ):
              getattr(lib, name)
          PY

      - name: Package
        id: package
        run: |
          bundle="parakeet-${{ inputs.release_tag }}-lib-macos-metal-arm64"
          mkdir "$bundle"
          cp build-shared/libparakeet.dylib include/parakeet_capi.h LICENSE README.md "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.bundle }}
          path: ${{ steps.package.outputs.bundle }}.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Apply ggml patches with Git Bash
        run: bash scripts/apply_ggml_patches.sh

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure shared C API library
        run: |
          version="${{ inputs.release_tag }}"
          cmake -B build-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DPARAKEET_SHARED=ON \
            -DPARAKEET_BUILD_CLI=OFF \
            -DPARAKEET_BUILD_SERVER=OFF \
            -DPARAKEET_BUILD_TESTS=OFF \
            -DPARAKEET_VERSION="${version#v}"

      - name: Build
        run: cmake --build build-shared -j

      - name: Verify ABI and streaming exports
        run: |
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL(r"build-shared\parakeet.dll")
          lib.parakeet_capi_abi_version.restype = ctypes.c_int
          assert lib.parakeet_capi_abi_version() == 7
          for name in (
              "parakeet_capi_stream_begin",
              "parakeet_capi_stream_feed_json",
              "parakeet_capi_stream_finalize_json",
              "parakeet_capi_stream_reset",
              "parakeet_capi_stream_free",
          ):
              getattr(lib, name)
          PY

      - name: Package
        id: package
        shell: pwsh
        run: |
          $bundle = "parakeet-${{ inputs.release_tag }}-lib-win-cpu-x64"
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item build-shared/parakeet.dll,include/parakeet_capi.h,LICENSE,README.md $bundle/
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
          "bundle=$bundle" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.bundle }}
          path: ${{ steps.package.outputs.bundle }}.zip
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all shared-library artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * | sort -k2 > SHA256SUMS

      - name: Create/update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ! [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be an exact 40-character commit SHA, got: $SOURCE_REF"
            exit 1
          fi

          SOURCE_SHA=$(gh api "repos/$REPOSITORY/commits/$SOURCE_REF" --jq .sha)
          if [ "$SOURCE_SHA" != "$SOURCE_REF" ]; then
            echo "::error::source_ref resolved to $SOURCE_SHA instead of itself"
            exit 1
          fi

          # A release can pre-exist, but its tag must identify the exact source
          # these binaries were built from. This prevents a later tag workflow
          # from rebuilding the same filenames from older code.
          if gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --silent >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
            if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::$RELEASE_TAG points at $TAG_SHA, but assets were built from $SOURCE_SHA"
              exit 1
            fi
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --draft \
              --target "$SOURCE_REF" --title "$RELEASE_TAG" \
              --notes "ABI-7 shared libraries for downstream FFI consumers. The full parakeet.cpp release matrix can be dispatched later against this same tag."
          fi
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber dist/*
